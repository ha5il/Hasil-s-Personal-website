<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
    <link rel="canonical" href="https://hasilpaudyal.com.np/">

    <!-- Fonts: preconnect early so DNS resolves before the stylesheet fires -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Material+Icons&display=swap">

    <!-- Default title + description — seoMixins.js overrides these per-page after hydration -->
    <title>Hasil Paudyal — Developer, Writer & Creator</title>
    <meta name="description" content="Personal website of Hasil Paudyal — software projects, poetry, quotes, and more.">
    <meta name="author" content="Hasil Paudyal">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="/icon.png">

    <!-- Open Graph — Facebook, WhatsApp, LinkedIn, iMessage -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Hasil Paudyal">
    <meta property="og:url" content="https://hasilpaudyal.com.np/">
    <meta property="og:title" content="Hasil Paudyal — Developer, Writer & Creator">
    <meta property="og:description" content="Personal website of Hasil Paudyal — software projects, poetry, quotes, and more.">
    <meta property="og:image" content="https://hasilpaudyal.com.np/og-image.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Hasil Paudyal">
    <meta property="og:locale" content="en_US">

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Hasil Paudyal — Developer, Writer & Creator">
    <meta name="twitter:description" content="Personal website of Hasil Paudyal — software projects, poetry, quotes, and more.">
    <meta name="twitter:image" content="https://hasilpaudyal.com.np/og-image.jpg">
    <meta name="twitter:image:alt" content="Hasil Paudyal">

    <!-- Browser / PWA theme colours -->
    <meta name="theme-color" content="#6e161c">
    <meta name="msapplication-navbutton-color" content="#6e161c">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
