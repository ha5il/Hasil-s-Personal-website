name: 🚀 Build & Deploy to CF Pages

on:
  push:
    branches: [vue]
  workflow_dispatch: {} # 🛠️ Manual trigger

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: 🌍 Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🔖 Create GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: []
            });
            return data.id;

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # 🌐 Guarantees a Chrome binary and exposes its path for the prerender script.
      - name: 🌐 Setup Chrome for Prerendering
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: 📦 Install dependencies
        run: npm ci

      # ⚙️ vite build + scripts/prerender.mjs (snapshots every route in sitemap.xml).
      - name: 🏗️ Build & Prerender
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run build:seo

      - name: ☁️ Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --commit-dirty=true

      - name: 🚦 Update GitHub deployment status
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.result }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: parseInt(process.env.DEPLOYMENT_ID),
              state: process.env.JOB_STATUS === 'success' ? 'success' : 'failure',
              environment_url: 'https://hasilpaudyal.com.np',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
